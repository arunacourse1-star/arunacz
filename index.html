<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <!-- Anda bisa mengubah teks di dalam <title> sesuai nama aplikasi Anda -->
  <title>Aplikasi Web Digital</title>
  <meta name="description" content="Portal Aplikasi Web">
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/5968/5968853.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Layar Loading sebelum aplikasi Google Apps Script selesai dimuat */
    #loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #ffffff;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #e2e8f0;
      border-top: 4px solid #2563eb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 14px;
    }

    .loading-text {
      color: #475569;
      font-size: 14px;
      font-weight: 500;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <!-- Animasi Loading -->
  <div id="loader">
    <div class="spinner"></div>
    <div class="loading-text">Memuat aplikasi...</div>
  </div>

  <!-- URL Google Apps Script Anda sudah terpasang di bawah ini -->
  <iframe 
    id="gas-frame"
    src="https://script.google.com/macros/s/AKfycbzc-QIyJ9uk5xGkotgI4UOH3LwA3t9q8pVmOGndOB4XeLLIRq9wrHntRGFaeVYR-S0WLw/exec" 
    allow="geolocation; microphone; camera; clipboard-read; clipboard-write; fullscreen"
    onload="hideLoader()">
  </iframe>

  <script>
    function hideLoader() {
      const loader = document.getElementById('loader');
      loader.style.opacity = '0';
      setTimeout(() => {
        loader.style.display = 'none';
      }, 400);
    }
  </script>

</body>
</html>
